<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>IVRIT • מבחן עברית</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"><span></span><span></span><span></span></div>

  <main class="app">
    <section id="home" class="screen active">
      <div class="brand"><div class="logo">א</div><span>IVRIT<span class="dot">.</span></span></div>
      <div class="hero">
        <div class="badge">⚡ SMART QUIZ</div>
        <h1>מבחן עברית<br><span>ברמה אחרת.</span></h1>
        <p>בניינים • חלקי דיבור • שאלות מאתגרות</p>
        <div class="mode-grid">
          <button class="mode selected" data-mode="mixed"><b>🧠</b><strong>מבחן משולב</strong><small>בניינים + חלקי דיבור</small></button>
          <button class="mode" data-mode="buildings"><b>🏗️</b><strong>בניינים</strong><small>תרגול ממוקד</small></button>
          <button class="mode" data-mode="speech"><b>🔤</b><strong>חלקי דיבור</strong><small>תרגול ממוקד</small></button>
        </div>
        <button id="start" class="primary">התחל מבחן <span>←</span></button>
        <div class="features"><span>⏱️ טיימר</span><span>🔥 קומבו</span><span>🏆 ציון</span><span>📱 מובייל</span></div>
      </div>
    </section>

    <section id="quiz" class="screen">
      <header class="quiz-head">
        <button id="quit" class="icon-btn">✕</button>
        <div class="mini-brand">IVRIT<span class="dot">.</span></div>
        <div class="timer">⏱ <span id="time">10:00</span></div>
      </header>
      <div class="progress-wrap"><div id="progress" class="progress"></div></div>
      <div class="quiz-meta"><span id="counter">שאלה 1 / 10</span><span id="combo">🔥 0 קומבו</span></div>
      <article class="question-card">
        <div id="type" class="question-type">בניינים</div>
        <h2 id="question"></h2>
        <div id="answers" class="answers"></div>
        <div id="feedback" class="feedback"></div>
      </article>
      <button id="next" class="primary next" disabled>המשך <span>←</span></button>
    </section>

    <section id="result" class="screen">
      <div class="result-top"><div class="brand"><div class="logo">א</div><span>IVRIT<span class="dot">.</span></span></div></div>
      <div class="trophy">🏆</div>
      <div class="badge">MISSION COMPLETE</div>
      <h1 id="resultTitle">סיימת!</h1>
      <div class="score-ring"><div><strong id="finalScore">0</strong><small>%</small></div></div>
      <p id="resultText"></p>
      <div class="stats">
        <div><b id="correct">0</b><span>נכונות</span></div>
        <div><b id="wrong">0</b><span>שגויות</span></div>
        <div><b id="bestCombo">0</b><span>קומבו שיא</span></div>
      </div>
      <div class="result-actions">
        <button id="again" class="primary">🔄 נסה שוב</button>
        <button id="homeBtn" class="secondary">⌂ תפריט ראשי</button>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
